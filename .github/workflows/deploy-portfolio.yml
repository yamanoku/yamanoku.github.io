# portfolio/ を変更した pull request が main にマージされたあと、その commit をデプロイする。
# push はマージ（merge / squash / rebase）で main に届いた変更を見る。未マージの pull request では動かない。
name: Deploy portfolio

on:
  push:
    branches:
      - main
    paths:
      - "portfolio/**"

permissions:
  contents: read

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Use Node.js from portfolio/.node-version
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: portfolio/.node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy portfolio
        run: pnpm portfolio:deploy
        env:
          CF_SEND_TELEMETRY: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTFOLIO_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "1b16f7266470fc5782fd6254ba8efec9"
