name: Publish Package yama-normalize

on:
  push:
    tags:
      - 'yama-normalize@*'

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install pnpm
      uses: pnpm/action-setup@v6.1.0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
    - name: Update npm latest
      run: npm install -g npm@latest
    - name: install, test, and publish
      run: |
        pnpm install
        pnpm yama-normalize test
        pnpm publish --no-git-checks ./packages/yama-normalize
