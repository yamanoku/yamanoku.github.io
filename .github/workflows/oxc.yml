name: Oxc

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.ts"
      - "**.js"
      - "**.mjs"
      - "**.astro"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install pnpm
      uses: pnpm/action-setup@v6.1.0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
    - name: check oxlint and oxfmt
      run: |
        pnpm install
        pnpm run ox:ci
      env:
        CI: true
